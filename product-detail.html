<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lyy Store - Final Fix</title>
    <style>
        :root { --p: #ff8c00; --bg: #060300; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; }

        /* Card Produk */
        .card { background: #0d0600; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-top: 20px; }
        .harga { color: var(--p); font-size: 32px; font-weight: bold; margin: 15px 0; }

        /* Tombol - Pakai button saja jangan <a> */
        .btn { 
            width: 100%; padding: 15px; border-radius: 10px; border: none; 
            font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 10px;
            display: block; text-align: center;
        }
        .btn-pay { background: var(--p); color: black; }
        .btn-cart { background: #222; color: white; }

        /* MODAL - Pakai Z-Index Tertinggi */
        #modal-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none; /* Sembunyi awal */
            z-index: 99999;
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: #111; width: 90%; max-width: 350px; 
            padding: 25px; border-radius: 20px; border: 1px solid #444;
            text-align: center;
        }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #444; background: #000; color: white; outline: none; }
    </style>
</head>
<body>

    <div style="max-width: 500px; margin: auto;">
        <img src="OIP.jpg" style="width: 100%; border-radius: 15px; border: 1px solid #333;">
        
        <h1 style="margin-top:15px;">Drip Client <span style="color:var(--p)">V3</span></h1>
        <p style="color:#888;">Lyy Store Official</p>

        <div class="card">
            <div class="harga">Rp125.000</div>
            
            <button type="button" class="btn btn-cart" onclick="addKeCart(event)">+ Keranjang</button>
            <button type="button" class="btn btn-pay" onclick="bukaModal(event)">Bayar Sekarang</button>
        </div>
    </div>

    <div id="modal-layer">
        <div class="modal-box">
            <h2 style="color:var(--p)">Konfirmasi</h2>
            <p style="margin-top:10px; font-size: 14px;">Detail: Drip Client - 15 Hari</p>
            
            <input type="number" id="nomor-wa" placeholder="Nomor WhatsApp">
            
            <button type="button" class="btn btn-pay" onclick="kirimWA(event)">Lanjut WhatsApp</button>
            <button type="button" onclick="tutupModal(event)" style="background:none; border:none; color:#888; margin-top:10px;">Batal</button>
        </div>
    </div>

    <script>
        // Gunakan e.preventDefault() untuk mengunci browser agar tidak scroll/reload
        function bukaModal(e) {
            if(e) e.preventDefault(); 
            document.getElementById('modal-layer').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Kunci scroll layar belakang
        }

        function tutupModal(e) {
            if(e) e.preventDefault();
            document.getElementById('modal-layer').style.display = 'none';
            document.body.style.overflow = 'auto'; // Aktifkan scroll lagi
        }

        function addKeCart(e) {
            if(e) e.preventDefault();
            alert("Berhasil masuk keranjang!");
        }

        function kirimWA(e) {
            if(e) e.preventDefault();
            var wa = document.getElementById('nomor-wa').value;
            if(wa.length < 5) {
                alert("Isi nomor WA dulu bos!");
            } else {
                alert("Gas ke WhatsApp Admin...");
            }
        }
    </script>

</body>
</html>
