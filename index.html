<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyy Store | Premium Digital Tools</title>
    <!-- Font & Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Singkat agar tampilan gelap & mewah */
        body { background-color: #0a0a0b; color: white; font-family: sans-serif; margin: 0; }
        .hero { text-align: center; padding: 50px 20px; }
        .hero img { width: 150px; border-radius: 50%; border: 2px solid #ff9800; }
        h1 { color: #ff9800; }
        
        /* Footer sesuai gambar yang kamu mau */
        footer { background-color: #050505; padding: 40px 20px; margin-top: 50px; border-top: 1px solid #1f1f1f; }
        .footer-grid { display: flex; justify-content: space-around; flex-wrap: wrap; max-width: 1200px; margin: auto; }
        .col { margin: 20px; min-width: 150px; }
        .col h3 { font-size: 14px; color: #ff9800; }
        .col ul { list-style: none; padding: 0; }
        .col li { margin: 10px 0; font-size: 13px; color: #a0a0a0; }
        .copy { text-align: center; padding: 20px; font-size: 12px; color: #555; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <div class="hero">
        <!-- Pastikan file logo-serigala.png ada di folder yang sama di GitHub -->
        <img src="logo-serigala.png" alt="Lyy Store Logo">
        <h1>LYY STORE</h1>
        <p>Premium digital tools, panel & file terpercaya.</p>
    </div>

    <footer>
        <div class="footer-grid">
            <div class="col">
                <h3>PRODUK</h3>
                <ul>
                    <li>Free Fire</li>
                    <li>Mobile Legends</li>
                    <li>PC Tools</li>
                </ul>
            </div>
            <div class="col">
                <h3>AKUN</h3>
                <ul>
                    <li>Topup Saldo</li>
                    <li>Riwayat Order</li>
                </ul>
            </div>
            <div class="col">
                <h3>INFO</h3>
                <ul>
                    <li>FAQ</li>
                    <li>Syarat & Kebijakan</li>
                    <li>Kontak Kami</li>
                </ul>
            </div>
        </div>
        <div class="copy">
            &copy; 2026 LYY STORE — All rights reserved
        </div>
    </footer>

</body>
</html>
