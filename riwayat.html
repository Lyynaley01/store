<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - Lyy Store</title>
    <style>
        :root {
            --primary-orange: #ff6600; /* Warna oranye Lyy Store */
            --bg-dark: #0a0b0d;
            --card-bg: #111418;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Container Utama */
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Tab Riwayat & Leaderboard */
        .tab-wrapper {
            display: flex;
            gap: 10px;
            background: #161b22;
            padding: 8px;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 25px;
        }

        .tab-item {
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-item.active {
            background: rgba(255, 102, 0, 0.2); /* Oranye transparan */
            color: var(--primary-orange);
            border: 1px solid var(--primary-orange);
        }

        /* Card Riwayat */
        .history-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #232830;
            min-height: 400px;
            position: relative;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .title-line {
            border-left: 4px solid var(--primary-orange); /* Garis Oranye */
            padding-left: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .filter-group {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .filter-btn.active {
            background: rgba(255, 102, 0, 0.1);
            color: var(--primary-orange);
        }

        /* Konten Kosong (Gagal Memuat) */
        .empty-state {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .icon-error {
            background: rgba(255, 69, 69, 0.1);
            color: #ff4545;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
            border: 2px solid #ff4545;
        }

        .empty-state h3 {
            margin: 0;
            font-size: 1.5rem;
        }

        .empty-state p {
            color: var(--text-gray);
            margin-top: 10px;
        }

        .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background-color: rgba(255, 165, 0, 0.1); /* Oranye transparan */
        color: orange;
        border: 1px solid orange;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .btn-home:hover {
        background-color: rgb(255, 115, 0);
        color: white;
        box-shadow: 0 0 10px rgba(255, 157, 0, 0.3);
    }
    </style>
</head>
<body>
    <!-- Tombol Kembali ke Home -->
<div style="margin-bottom: 20px;">
    <a href="index.html" class="btn-home">
        <i class="fas fa-arrow-left"></i> Kembali ke Home
    </a>
</div>

<div class="container">
    <!-- Header Tab -->
    <div class="tab-wrapper">
        <a href="#" class="tab-item active">📋 Riwayat</a>
    </div>

    <!-- Main History Card -->
    <div class="history-card">
        <div class="header-section">
            <div class="title-line">Riwayat Transaksi</div>
            <div class="filter-group">
                <button class="filter-btn active">Semua</button>
                <button class="filter-btn">Produk</button>
                <button class="filter-btn">Topup</button>
            </div>
        </div>

        <div class="history-card">
    <div id="list-transaksi">
        </div>
</div>

        <!-- Tampilan Gagal Memuat Sesuai Gambar -->
        <!-- Container untuk daftar transaksi -->
<div id="list-transaksi">
    <!-- Data akan muncul di sini secara otomatis -->
</div>

<script type="module">
    // 1. Import library Firebase terbaru
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 2. Konfigurasi Lyy Store
    const firebaseConfig = {
        apiKey: "AIzaSyATMm7NhnDgOI3klh2EiV7xkb9GMIoUWHg",
        authDomain: "lyynaleyxiters.firebaseapp.com",
        projectId: "lyynaleyxiters",
        appId: "1:85048055336:web:4a8b07e8ef32690e36871d",
    };

    // 3. Inisialisasi
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 4. Logika Menampilkan Riwayat
    onAuthStateChanged(auth, (user) => {
        const listContainer = document.getElementById('list-transaksi');
        
        if (user) {
            // Ambil data berdasarkan userId agar sinkron dengan pembelian
            const q = query(
                collection(db, "orders"),
                where("userId", "==", user.uid),
                orderBy("tanggal", "desc")
            );

            onSnapshot(q, (querySnapshot) => {
                if (!listContainer) return;
                listContainer.innerHTML = ""; 

                if (querySnapshot.empty) {
                    listContainer.innerHTML = "<p style='color:gray; text-align:center; padding:20px;'>Belum ada transaksi.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const tgl = data.tanggal?.toDate() ? data.tanggal.toDate().toLocaleString('id-ID') : "-";
                    
                    listContainer.innerHTML += `
                        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid orange;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong style="color: white;">${data.namaProduk}</strong>
                                <span style="color: orange; font-weight: bold;">Rp${data.harga.toLocaleString('id-ID')}</span>
                            </div>
                            <div style="font-size: 12px; color: #aaa; margin-top: 8px; display: flex; justify-content: space-between;">
                                <span>${tgl}</span>
                                <span style="color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 2px 8px; border-radius: 4px;">${data.status}</span>
                            </div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Error Riwayat:", error);
                // Jika muncul error index di Console F12, klik link yang ada di sana.
            });
        } else {
            if (listContainer) {
                listContainer.innerHTML = "<p style='color:white; text-align:center;'>Silakan login terlebih dahulu.</p>";
            }
        }
    });
</script>
</body>
</html>
