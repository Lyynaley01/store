<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS - Lyynaley</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0f121d;
            --accent-blue: #f6863b;
            --accent-purple: #f6c55c;
            --text-main: #ffffff;
            --text-muted: #8a8d93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        /* Dekorasi Cahaya di Background */
        .payment-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--accent-orange);
            filter: blur(80px);
            opacity: 0.2;
            z-index: 0;
        }

        .header-section {
            position: relative;
            z-index: 1;
        }

        .header-section h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header-section span {
            color: var(--accent-orange);
        }

        .merchant-name {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Area QR Code */
        .qris-container {
            background: white; /* Putih agar QR mudah dipindai */
            width: 280px;
            height: 280px;
            margin: 30px auto;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(246, 168, 59, 0.2);
        }

        .qris-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Placeholder sebelum kamu masukkan fotonya */
            background: #eee;
            color: #333;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Instruksi Pembayaran */
        .instruction-box {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            margin-bottom: 25px;
        }

        .step {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .step i {
            color: var(--accent-orange);
            margin-top: 3px;
        }

        /* Button Konfirmasi */
        .btn-confirm {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(246, 156, 59, 0.4);
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(246, 162, 59, 0.6);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="payment-card">
    <div class="header-section">
        <h1>Lyy <span>Store</span></h1>
        <div class="merchant-name">Merchant ID: Lyynaley</div>
    </div>

    <div class="qris-container">
        <!-- MASUKKAN FOTO QRIS KAMU DI SINI -->
        <img src="WhatsApp Image 2026-05-14 at 00.30.45.jpeg" alt="QRIS Lyynaley" class="qris-image">
    </div>

    <div class="instruction-box">
        <div class="step">
            <i class="fas fa-camera"></i>
            <span>Scan QRIS di atas menggunakan e-wallet (DANA, OVO, GoPay).</span>
        </div>
        <div class="step">
            <i class="fas fa-money-bill-wave"></i>
            <span>Masukkan nominal sesuai harga produk dan selesaikan pembayaran.</span>
        </div>
        <div class="step">
            <i class="fas fa-check-circle"></i>
            <span>Klik tombol di bawah untuk kirim bukti transfer.</span>
        </div>
    </div>

    <a href="https://wa.me/62895328955017?text=Halo%20Lyy%20Store,%20saya%20sudah%20melakukan%20pembayaran" class="btn-confirm">
        <i class="fas fa-paper-plane"></i> Konfirmasi Pembayaran
    </a>

    <div class="footer-note">
        Pembayaran Aman & Terverifikasi Otomatis
    </div>
</div>

</body>
</html>
